# Load balancer for the API replicas. Only this container is published.

resolver 127.0.0.11 valid=5s ipv6=off;

upstream api {
    zone api 64k;
    least_conn;
    server api:8000 resolve max_fails=2 fail_timeout=5s;  # every replica Docker knows about
    keepalive 32;
}

# A request caught while Docker is removing a dead replica gets one fresh try on the new list.
# Only where repeating is harmless: reads, and webhooks (idempotent by event id).
map "$request_method $uri" $safe_to_repeat {
    default 0;
    "~^(GET|HEAD) " 1;
    "~^POST /webhooks/" 1;
}

limit_req_zone $binary_remote_addr zone=clients:1m rate=50r/s;
limit_req_status 429;

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 1s;
    proxy_read_timeout 30s;

    error_page 502 504 = @again;
    location @again {
        if ($safe_to_repeat = 0) { return 503; }
        proxy_pass http://api;
    }

    location = /gateway/health { access_log off; default_type text/plain; return 200 "ok"; }

    # Webhooks are idempotent, so a replica that died or is overloaded can simply be skipped.
    # Not rate limited: dropping provider traffic would lose billing data. The pool sheds load.
    location /webhooks/ {
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_pass http://api;
    }

    location /metrics { return 404; }  # scraped per replica, inside the network

    location / {
        limit_req zone=clients burst=100 nodelay;
        proxy_pass http://api;
    }
}
