name: callzo-backend

# Development defaults are inline so `docker compose up` needs no setup. Override them in a
# gitignored `.env` next to this file (see .env.example). The application itself has no secret
# defaults: it refuses to start if one is missing.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardened: &hardened
  init: true                 # forwards signals, reaps zombies, lets a crash exit the container
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

x-app: &app
  <<: *hardened
  image: avnisinghal01/callzo-task1-backend:1.0.1   # from source instead: docker-compose.build.yml
  environment:
    DATABASE_URL: postgresql://callzo:${POSTGRES_PASSWORD:-dev-only-password}@postgres:5432/callzo
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:-callzo_test_secret_change_me}
    WEBHOOK_SECRET_PREVIOUS: ${WEBHOOK_SECRET_PREVIOUS:-}
    API_KEY: ${API_KEY:-dev-only-api-key-change-me}
    API_KEY_PREVIOUS: ${API_KEY_PREVIOUS:-}
    ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-only-admin-key-change-me}
    ADMIN_API_KEY_PREVIOUS: ${ADMIN_API_KEY_PREVIOUS:-}
    # Opens the console without a sign-in. Safe here only because the gateway is published on
    # 127.0.0.1 and unknown Host headers are refused. Set to false for anything shared.
    CONSOLE_OPEN_ACCESS: ${CONSOLE_OPEN_ACCESS:-true}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api,gateway}
    ENABLE_SANDBOX: ${ENABLE_SANDBOX:-true}
    DOCS_ENABLED: ${DOCS_ENABLED:-true}
    DEFAULT_MONTHLY_CAP_MINUTES: ${DEFAULT_MONTHLY_CAP_MINUTES:-200}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Per API replica. Total = replicas x max size; see "Connection budget" in the README.
    DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-2}
    DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-8}
    DB_POOL_MAX_WAITING: ${DB_POOL_MAX_WAITING:-32}
    DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
    CLAIM_LEASE_SECONDS: ${CLAIM_LEASE_SECONDS:-60}
    FORWARDED_ALLOW_IPS: "*"   # only the gateway can reach the API on this private network

services:
  gateway:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/gateway/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    restart: unless-stopped
    stop_grace_period: 20s
    deploy: { replicas: 2 }
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s

  worker:
    <<: *app
    command: ["python", "-m", "app.modules.metering.worker"]
    restart: unless-stopped
    stop_grace_period: 20s
    deploy: { replicas: 2 }
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:   # the work loop touches this file; a stuck loop goes unhealthy
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-alive') > 30)"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 10s

  migrate:
    <<: *app
    command: ["python", "-m", "app.migrate"]
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:17.12-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: callzo
      POSTGRES_DB: callzo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    logging: *logging
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U callzo -d callzo"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The provided webhook simulator: runs every scenario once, then exits.
  simulator:
    image: meetrj/callzo-webhook-simulator
    depends_on:
      gateway: { condition: service_healthy }
    command: ["--url", "http://gateway:8080/webhooks/calls", "--scenario", "all"]

  # docker compose --profile test run --rm --build tests
  tests:
    profiles: ["test"]
    build: { context: ., target: test }
    environment:
      TEST_DATABASE_URL: postgresql://callzo:${POSTGRES_PASSWORD:-dev-only-password}@postgres:5432/postgres
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres-data:
