name: backend

on:
  push: { branches: [main], paths: ["backend/**", ".github/workflows/backend.yml"] }
  pull_request: { paths: ["backend/**", ".github/workflows/backend.yml"] }

permissions: { contents: read }

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17.12-alpine
        env: { POSTGRES_USER: callzo, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: callzo }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U callzo" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.11.18" }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env: { TEST_DATABASE_URL: "postgresql://callzo:ci-only@localhost:5432/postgres" }
      - run: docker build --target runtime -t callzo-task1-backend .
